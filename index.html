async function sendMail(to,code){
 const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:EMAILJS.svc,template_id:EMAILJS.tpl,user_id:EMAILJS.pub,template_params:{to_email:to,passcode:code,app_name:'GT-DAYN'}})});
 if(!r.ok)throw new Error(await r.text());
}
function setMode(m){const e=$('#em');if(e)AU.email=e.value.trim().toLowerCase();AU.mode=m;AU.step=1;authUI()}
function authUI(){
 const two=AU.step==2;
 let body;
 if(two){
  body=`<h1>تحقق من بريدك</h1>
  <p class="sub">أرسلنا رمزاً من 6 أرقام إلى<br><b dir="ltr">${esc(AU.email)}</b></p>
  ${!EMAIL_READY&&AU.code?`<div class="dm">وضع التجربة: خدمة البريد لم تُربط بعد<br><b dir="ltr" style="font-size:20px;letter-spacing:4px">${AU.code}</b></div>`:''}
  <div class="otp" id="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" autocomplete="${i?'off':'one-time-code'}" aria-label="رقم ${i+1}">`).join('')}</div>
  <div class="err" id="er"></div>
  <button class="pri" onclick="verifyOtp()">تأكيد ودخول</button>
  <div class="row" style="margin-top:6px"><button class="link" id="rs" onclick="sendOtp(true)">إعادة الإرسال</button><button class="link" onclick="AU.step=1;authUI()">تغيير البريد</button></div>`;
 }else{
  body=`<h1>أهلاً بك في GT-DAYN</h1>
  <p class="sub">ادخل بريدك وسنرسل لك رمزاً للتأكيد. أول مرة؟ بعد الرمز بتكمل اسم المستخدم وكلمة السر.</p>
  <label>البريد الإلكتروني<input id="em" type="email" inputmode="email" dir="ltr" autocomplete="email" autocapitalize="none" placeholder="name@example.com" value="${esc(AU.email)}"></label>
  <div class="err" id="er"></div>
  <button class="pri" id="go" onclick="sendOtp()">إرسال الرمز</button>`;
 }
 $('#app').innerHTML=`<div class="lg"><div class="lc">${langBar()}<div class="logo">${ICON(76)}</div>${stepper(two?2:1)}${body}<p class="lfoot">🔒 بياناتك تبقى على جهازك · <button class="link" style="padding:0;font-size:12px" onclick="privacyM()">سياسة الخصوصية</button></p></div></div>`;
 if(two){bindOtp();startCool()}
 else{const e=$('#em');if(e)e.addEventListener('keydown',x=>{if(x.key==='Enter')sendOtp()})}
}
async function sendOtp(again,purpose){
 if(!again){const e=$('#em').value.trim().toLowerCase();if(!isMail(e))return err('اكتب بريداً إلكترونياً صحيحاً');AU.email=e;AU.purpose=purpose||'login'}
 if(AU.cool>Date.now())return err('انتظر قليلاً قبل طلب رمز جديد');
 const b=$('#go')||$('#rs');if(b)b.disabled=true;
 const code=genCode();
 try{if(EMAIL_READY)await sendMail(AU.email,code)}
 catch(x){if(b)b.disabled=false;return err('تعذّر الإرسال: '+String(x&&x.message||x).slice(0,200))}
 Object.assign(AU,{code,exp:Date.now()+6e5,tries:0,cool:Date.now()+6e4,step:2});
 authUI();
}
function passLogin(){
 const idv=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
 const key=isMail(idv)?idv:(Object.keys(users).find(k=>users[k].un===idv)||null);
 const u=key?users[key]:null;
 if(!u)return err('البريد أو كلمة السر غلط');
 if(!u.h)return err('حسابك ما اكتمل بعد، ادخل بالرمز البريدي وأكمل الإعداد');
 if(AU.fails>=5)return err('محاولات كثيرة. استخدم الرمز البريدي');
 pbk(p,u.s).then(h=>{
  if(h!==u.h){AU.fails++;return err('البريد أو كلمة السر غلط')}
  AU.fails=0;AU.email=key;
  if(!u.un){setupUI('new');return}
  enter(key);
 });
}
function startCool(){
 clearInterval(AU.timer);
 const tick=()=>{const b=$('#rs');if(!b){clearInterval(AU.timer);return}const n=Math.ceil((AU.cool-Date.now())/1000);b.disabled=n>0;b.textContent=n>0?'إعادة الإرسال بعد '+n+' ث':'إعادة الإرسال';if(n<=0)clearInterval(AU.timer)};
 tick();AU.timer=setInterval(tick,1000);
}
function fillOtp(t){const ins=[...document.querySelectorAll('#otp input')];t.slice(0,6).split('').forEach((c,j)=>ins[j].value=c);ins[Math.min(t.length,5)].focus();if(t.length>=6)verifyOtp()}
function bindOtp(){
 const ins=[...document.querySelectorAll('#otp input')];
 ins.forEach((el,i)=>{
  el.addEventListener('input',()=>{const d=el.value.replace(/\D/g,'');if(d.length>1)return fillOtp(d);el.value=d;if(d&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))verifyOtp()});
  el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0){ins[i-1].value='';ins[i-1].focus()}if(e.key==='Enter')verifyOtp()});
  el.addEventListener('paste',e=>{e.preventDefault();fillOtp((e.clipboardData.getData('text')||'').replace(/\D/g,''))});
 });
 ins[0].focus();
}
function verifyOtp(){
 const ins=[...document.querySelectorAll('#otp input')],v=ins.map(i=>i.value).join('');
 if(v.length<6)return err('أدخل الرمز كاملاً');
 if(!AU.code||Date.now()>AU.exp)return err('انتهت صلاحية الرمز، اطلب رمزاً جديداً');
 if(v!==AU.code){
  if(++AU.tries>=5){AU.code='';return err('تجاوزت عدد المحاولات، اطلب رمزاً جديداً')}
  ins.forEach(i=>i.value='');ins[0].focus();
  return err('الرمز غير صحيح، حاول مرة أخرى');
 }
 const reset=AU.purpose=='reset';
 AU.code='';AU.step=1;AU.purpose='login';
 const u=users[AU.email]||{};if(reset&&u.un&&u.h)setupUI('pw');else if(u.un&&u.h)enter(AU.email);else setupUI('new');
}
function enter(u){U=u;if(!users[u]){users[u]={};LS.s('dm_users',users)}D=LS.g('dm_d_'+u,null)||def();applyRec();save();LS.s('dm_sess',u);tab='home';clearInterval(AU.timer);shell();afterOpen()}
const logout=()=>{LS.s('dm_sess','');U=D=null;AU=AU0();authUI()};
function pwM(){const has=!!(users[U]&&users[U].h);modal(`<h3>${has?'تغيير كلمة السر':'إنشاء كلمة سر'}</h3><p class="mut" style="margin-bottom:6px">تقدر تدخل بها بدل الرمز. 6 أحرف على الأقل.</p><label>كلمة السر الجديدة<input id="f1" type="password" dir="ltr" autocomplete="new-password"></label><label>أعد كتابتها<input id="f2" type="password" dir="ltr" autocomplete="new-password"></label><div class="err" id="er"></div><button class="pri" onclick="savePw()">حفظ</button>`)}
async function savePw(){const a=$('#f1').value,b=$('#f2').value;if(a.length<6)return err('6 أحرف على الأقل');if(a!==b)return err('كلمتا السر غير متطابقتين');const s=rnd();users[U]={s,h:await pbk(a,s)};LS.s('dm_users',users);closeM();view()}
const pwCard=()=>{const has=!!(users[U]&&users[U].h);return `<div class="card"><b>🔑 كلمة السر</b><p class="mut" style="margin:4px 0 10px">${has?'مفعّلة، تقدر تدخل بها بدل الرمز.':'غير مفعّلة. فعّلها عشان تدخل بسرعة.'}</p><button onclick="pwM()">${has?'تغيير كلمة السر':'إنشاء كلمة سر'}</button></div>`};

function home(){let inn=0,out=0;const byc={};
 D.debts.forEach(d=>{const r=rem(d);if(!r)return;const x=conv(r,d.cur);d.dir=='in'?inn+=x:out+=x;byc[d.cur]=byc[d.cur]||{in:0,out:0};byc[d.cur][d.dir]+=r});
 const m=new Date().toISOString().slice(0,7);let ei=0,eo=0;const cats={};
 D.ex.filter(e=>e.date.startsWith(m)).forEach(e=>{const x=conv(e.amt,e.cur);if(e.type=='inc')ei+=x;else{eo+=x;cats[e.cat]=(cats[e.cat]||0)+x}});
 const B=D.base,cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=cl.length?cl[0][1]:1;
 const ms=[];for(let i=5;i>=0;i--){const dt=new Date();dt.setDate(1);dt.setMonth(dt.getMonth()-i);ms.push(dt.toISOString().slice(0,7))}
 const mv=ms.map(k=>{let a=0,b=0;D.ex.filter(e=>e.date.startsWith(k)).forEach(e=>{const x=conv(e.amt,e.cur);e.type=='inc'?a+=x:b+=x});return[k,a,b]});
 const mm=Math.max(1,...mv.flatMap(x=>[x[1],x[2]]));
 const up=D.debts.filter(d=>rem(d)>0&&d.due).sort((a,b)=>a.due>b.due?1:-1).slice(0,4);
 return `<div class="grid"><div class="card"><small>لي عند الناس</small><div class="big g">${fmt(inn,B)}</div></div><div class="card"><small>عليّ للناس</small><div class="big r">${fmt(out,B)}</div></div>
 <div class="card"><small>صافي الديون</small><div class="big ${inn>=out?'g':'r'}">${fmt(inn-out,B)}</div></div><div class="card"><small>رصيد هذا الشهر</small><div class="big ${ei>=eo?'g':'r'}">${fmt(ei-eo,B)}</div><small>دخل ${fmt(ei,B)}</small></div></div>
 <div class="card"><b>مصاريف هذا الشهر: ${fmt(eo,B)}</b>${cl.length?cl.map(([k,v])=>`<div class="bar"><span>${k}</span><div><i style="width:${v/mx*100}%"></i></div><em>${fmt(v,B)}</em></div>`).join(''):'<p class="mut" style="margin-top:8px">لا مصاريف بعد</p>'}</div>
 <div class="card"><b>آخر 6 أشهر</b><div class="mc" style="margin-top:10px">${mv.map(x=>`<div><p><b style="height:${x[1]/mm*100}%;background:var(--grn)"></b><b style="height:${x[2]/mm*100}%;background:var(--red)"></b></p>${x[0].slice(5)}</div>`).join('')}</div><small><span class="g">■</span> دخل &nbsp;<span class="r">■</span> مصروف</small></div>
 ${Object.keys(byc).length?`<div class="card"><b>الديون حسب العملة</b>${Object.entries(byc).map(([c,v])=>`<div class="row" style="margin-top:8px"><span>${c}</span><span><span class="g">${fmt(v.in,c)}</span> · <span class="r">${fmt(v.out,c)}</span></span></div>`).join('')}</div>`:''}
 ${up.length?`<h2>أقرب الاستحقاقات</h2>${up.map(d=>`<div class="card row"><div><b>${esc(d.person)}</b><br><small class="${d.due<today()?'r':''}">${d.due}${d.due<today()?' · متأخر':''}</small></div><b class="${d.dir=='in'?'g':'r'}">${fmt(rem(d),d.cur)}</b></div>`).join('')}`:''}`}

/* ---------- الديون ---------- */
function debts(){const f=fl.debt,q=fl.q.toLowerCase();
 const L=D.debts.filter(d=>{const r=rem(d);return(f=='all'||(f=='done'?r==0:(r>0&&d.dir==f)))&&(!q||(d.person+' '+d.note).toLowerCase().includes(q))}).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1);
 const ch=CH;
 return `<input placeholder="🔍 بحث بالاسم أو الملاحظة" value="${esc(fl.q)}" oninput="fl.q=this.value;dl()"><div class="chips">${ch.map(c=>`<button class="${f==c[0]?'on':''}" onclick="fl.debt='${c[0]}';view()">${c[1]}</button>`).join('')}</div><div id="dl">${dlist(L)}</div>`}
function dl(){const q=fl.q.toLowerCase(),f=fl.debt;$('#dl').innerHTML=dlist(D.debts.filter(d=>{const r=rem(d);return(f=='all'||(f=='done'?r==0:(r>0&&d.dir==f)))&&(!q||(d.person+' '+d.note).toLowerCase().includes(q))}))}
function dlist(L){if(!L.length)return '<p class="mut" style="text-align:center;margin:30px">لا توجد ديون. اضغط ＋ للإضافة</p>';
 return L.map(d=>{const r=rem(d),p=Math.round(paid(d)/d.amt*100),od=r>0&&d.due&&d.due<today();
 return `<div class="card"><div class="row"><b>${esc(d.person)}</b><span class="tag ${d.dir}">${d.dir=='in'?'لي عنده':'عليّ له'}</span></div>
 <div class="big">${fmt(r,d.cur)}</div><small>من أصل ${fmt(d.amt,d.cur)}${d.cur!=D.base?' ≈ '+fmt(conv(r,d.cur),D.base):''}</small>
 <div class="pg"><i style="width:${p}%"></i></div><small>${d.due?'الاستحقاق: '+d.due:''}${od?' <b class="r">متأخر</b>':''}${d.note?' · '+esc(d.note):''}</small>
 <div class="acts">${r?`<button onclick="payM('${d.id}')">＋ دفعة</button>`:'<span class="ok">مسددة ✓</span>'}<button onclick="hist('${d.id}')">السجل</button>${d.sched?`<button onclick="schedM('${d.id}')">الأقساط</button>`:''}${d.dir=='in'&&r?`<button onclick="wa('${d.id}')">📲 تذكير</button>`:''}<button onclick="debtM('${d.id}')">تعديل</button><button class="del" onclick="delD('${d.id}')">حذف</button></div></div>`}).join('')}
function debtM(id){const d=id?D.debts.find(x=>x.id==id):{dir:'in',cur:D.base,date:today()},lk=!!(id&&d.sched);
 modal(`<h3>${id?'تعديل دين':'دين جديد'}</h3><div class="seg"><label><input type="radio" name="dr" value="in" ${d.dir=='in'?'checked':''}>لي عند شخص</label><label><input type="radio" name="dr" value="out" ${d.dir=='out'?'checked':''}>عليّ لشخص</label></div>
 <label>الاسم<input id="f1" value="${esc(d.person||'')}" list="pl"></label><datalist id="pl">${[...new Set(D.debts.map(x=>x.person))].map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
 <div class="two"><label>${lk?'إجمالي المبلغ':'المبلغ'}<input id="f2" type="number" inputmode="decimal" step="any" value="${d.amt||''}" ${lk?'disabled':''}></label><label>العملة<select id="f3" ${lk?'disabled':''}>${co(d.cur)}</select></label></div>
 <div class="two"><label>التاريخ<input id="f4" type="date" value="${d.date}"></label><label>الاستحقاق<input id="f5" type="date" value="${d.due||''}" ${lk?'disabled':''}></label></div>
 ${!id?`<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="fi" style="width:auto;margin:0" onchange="$('#ib').style.display=this.checked?'grid':'none';$('#f5').disabled=this.checked">قسّط المبلغ على دفعات شهرية</label><div id="ib" class="two" style="display:none;margin-top:8px"><label>عدد الأقساط<input id="fn" type="number" min="2" max="120" value="12"></label><label>تاريخ أول قسط<input id="fs" type="date" value="${today()}"></label></div>`:''}
 <label>ملاحظة<input id="f6" value="${esc(d.note||'')}"></label><div class="err" id="er"></div><button class="pri" onclick="saveD('${id||''}')">حفظ</button>`)}
function saveD(id){const p=$('#f1').value.trim(),a=parseFloat($('#f2').value);if(!p||!(a>0))return err('اكتب الاسم ومبلغاً صحيحاً');
 const old=id?D.debts.find(x=>x.id==id):null,inst=!id&&$('#fi')&&$('#fi').checked;
 const o={dir:document.querySelector('[name=dr]:checked').value,person:p,amt:old&&old.sched?old.amt:a,cur:$('#f3').value,date:$('#f4').value||today(),due:$('#f5').value,note:$('#f6').value.trim()};
 if(inst){const n=parseInt($('#fn').value),st=$('#fs').value;if(!(n>=2&&n<=120)||!st)return err('عدد الأقساط بين 2 و 120، واختر تاريخ أول قسط');o.sched=buildSched(a,n,st);o.due=o.sched[0].due}
 if(old){Object.assign(old,o);syncDue(old)}else D.debts.push({id:uid(),pays:[],...o});save();closeM();view()}
function schedM(id){const d=D.debts.find(x=>x.id==id),p=paid(d);let c=0;const rows=d.sched.map((x,i)=>{c+=x.amt;const ok=p>=c-1e-9,late=!ok&&x.due<today();return `<div class="row card" style="margin-top:8px"><span>${i+1}. ${x.due}<br><small>${fmt(x.amt,d.cur)}</small></span><span class="tag ${ok?'in':late?'out':''}">${ok?'مدفوع ✓':late?'متأخر':'قادم'}</span></div>`}).join('');modal(`<h3>أقساط ${esc(d.person)}</h3><p class="mut">${d.sched.length} قسط · الإجمالي ${fmt(d.amt,d.cur)}</p>${rows}`)}
function payM(id){const d=D.debts.find(x=>x.id==id);modal(`<h3>دفعة لـ ${esc(d.person)}</h3><small>المتبقي ${fmt(rem(d),d.cur)}</small>
 <div class="two"><label>المبلغ<input id="f1" type="number" inputmode="decimal" step="any" value="${rem(d)}"></label><label>التاريخ<input id="f2" type="date" value="${today()}"></label></div><div class="err" id="er"></div><button class="pri" onclick="savePay('${id}')">تسجيل الدفعة</button>`)}
function savePay(id){const d=D.debts.find(x=>x.id==id),a=parseFloat($('#f1').value);if(!(a>0)||a>rem(d)+1e-9)return err('المبلغ غير صحيح أو أكبر من المتبقي');d.pays.push({a,date:$('#f2').value||today()});syncDue(d);save();closeM();view()}
function hist(id){const d=D.debts.find(x=>x.id==id);modal(`<h3>سجل ${esc(d.person)}</h3><p class="mut">الدين الأصلي: ${fmt(d.amt,d.cur)} بتاريخ ${d.date}</p>${d.pays.length?d.pays.map((p,i)=>`<div class="row card" style="margin-top:8px"><span>${p.date} · <b>${fmt(p.a,d.cur)}</b></span><button class="del" onclick="delPay('${id}',${i})">حذف</button></div>`).join(''):'<p class="mut" style="margin-top:10px">لا توجد دفعات</p>'}`)}
function delPay(id,i){const d=D.debts.find(x=>x.id==id);d.pays.splice(i,1);syncDue(d);save();hist(id);view()}
const delD=id=>ask('تنقل هذا الدين للسلة؟ تقدر ترجعه خلال 30 يوم',()=>{const it=D.debts.find(x=>x.id==id);if(!it)return;D.debts=D.debts.filter(x=>x.id!=id);trashPush('debt',it);save();view()});

/* ---------- المصاريف ---------- */
function exps(){const L=D.ex.filter(e=>e.date.startsWith(fl.m)&&(fl.et=='all'||e.type==fl.et)).sort((a,b)=>a.date<b.date?1:-1);let i=0,o=0;
 D.ex.filter(e=>e.date.startsWith(fl.m)).forEach(e=>{const x=conv(e.amt,e.cur);e.type=='inc'?i+=x:o+=x});
 return `<input type="month" value="${fl.m}" onchange="fl.m=this.value||fl.m;view()"><div class="grid" style="margin-top:10px"><div class="card"><small>الدخل</small><div class="big g">${fmt(i,D.base)}</div></div><div class="card"><small>المصروف</small><div class="big r">${fmt(o,D.base)}</div></div></div>
 <div class="chips">${[['all','الكل'],['exp','مصاريف'],['inc','دخل']].map(c=>`<button class="${fl.et==c[0]?'on':''}" onclick="fl.et='${c[0]}';view()">${c[1]}</button>`).join('')}</div>
 ${L.length?L.map(e=>`<div class="card row"><div><b>${e.cat}</b><br><small>${e.date}${e.note?' · '+esc(e.note):''}</small></div><div style="text-align:left"><b class="${e.type=='inc'?'g':'r'}">${e.type=='inc'?'+':'−'}${fmt(e.amt,e.cur)}</b><br><small><a onclick="expM('${e.id}')" style="color:var(--pri)">تعديل</a> · <a onclick="delE('${e.id}')" style="color:var(--red)">حذف</a></small></div></div>`).join(''):'<p class="mut" style="text-align:center;margin:30px">لا توجد حركات في هذا الشهر</p>'}`}
function expM(id){const e=id?D.ex.find(x=>x.id==id):{type:'exp',cur:D.base,date:today(),cat:'طعام'};
 modal(`<h3>${id?'تعديل حركة':'حركة جديدة'}</h3><div class="seg"><label><input type="radio" name="et" value="exp" ${e.type=='exp'?'checked':''} onchange="catOpt()">مصروف</label><label><input type="radio" name="et" value="inc" ${e.type=='inc'?'checked':''} onchange="catOpt()">دخل</label></div>
 <div class="two"><label>المبلغ<input id="f1" type="number" inputmode="decimal" step="any" value="${e.amt||''}"></label><label>العملة<select id="f2">${co(e.cur)}</select></label></div>
 <div class="two"><label>التصنيف<select id="f3"></select></label><label>التاريخ<input id="f4" type="date" value="${e.date}"></label></div>
 <label>ملاحظة<input id="f5" value="${esc(e.note||'')}"></label><div class="err" id="er"></div><button class="pri" onclick="saveE('${id||''}')">حفظ</button>`);catOpt(e.cat)}
function catOpt(sel){const t=document.querySelector('[name=et]:checked').value,cur=sel||$('#f3').value;$('#f3').innerHTML=(t=='inc'?INC:CATS).map(c=>`<option ${c==cur?'selected':''}>${c}</option>`).join('')}
function saveE(id){const a=parseFloat($('#f1').value);if(!(a>0))return err('اكتب مبلغاً صحيحاً');
 const o={type:document.querySelector('[name=et]:checked').value,amt:a,cur:$('#f2').value,cat:$('#f3').value,date:$('#f4').value||today(),note:$('#f5').value.trim()};
 if(id)Object.assign(D.ex.find(x=>x.id==id),o);else D.ex.push({id:uid(),...o});save();closeM();view()}
const delE=id=>ask('تنقل هذه الحركة للسلة؟',()=>{const it=D.ex.find(x=>x.id==id);if(!it)return;D.ex=D.ex.filter(x=>x.id!=id);trashPush('ex',it);save();view()});

/* ---------- العملات ---------- */
function curs(){return `<div class="card"><label style="margin:0">العملة الأساسية (تُحوَّل لها كل المجاميع)<select onchange="setBase(this.value)">${co(D.base)}</select></label>
 <p class="mut" style="margin-top:8px;font-size:12px">الأسعار تقريبية وتُعدَّل يدوياً حسب سعر السوق عندك. السعر = كم ${D.base} تساوي وحدة واحدة من العملة. مثال: إذا كانت الليرة التركية 0.029 فهذا يعني 1 ليرة = 0.029 دولار.</p></div>
 <div class="card">${Object.entries(D.cur).map(([k,c])=>`<div class="crt"><span><b>${k}</b> ${c.s}<br><small>${esc(c.n)}</small></span><input type="number" step="any" inputmode="decimal" value="${+c.r.toPrecision(6)}" ${k==D.base?'disabled':''} onchange="setRate('${k}',this.value)">${k==D.base?'<span></span>':`<button class="del" onclick="delC('${k}')">✕</button>`}</div>`).join('')}</div>
 <div class="card"><button class="pri" style="margin-top:0" onclick="updRates()">🌐 تحديث الأسعار من الإنترنت</button><button style="width:100%;margin-top:8px" onclick="resetRates()">↺ استعادة الأسعار الافتراضية</button><p class="mut" id="rs" style="margin-top:8px;font-size:12px">يعمل عند الاتصال بالإنترنت.</p></div><h2>إضافة عملة</h2><div class="card"><div class="two"><label>الرمز (مثل SYP)<input id="c1" maxlength="5" style="text-transform:uppercase"></label><label>الرمز المختصر<input id="c2" maxlength="4"></label></div><label>الاسم<input id="c3"></label><label>السعر مقابل ${D.base}<input id="c4" type="number" step="any" inputmode="decimal"></label><div class="err" id="er"></div><button class="pri" onclick="addC()">إضافة</button></div>`}
function setRate(k,v){v=parseFloat(v);if(v>0){D.cur[k].r=v;save();}view()}
function setBase(nb){const f=D.cur[nb].r;Object.values(D.cur).forEach(c=>c.r/=f);D.cur[nb].r=1;D.base=nb;save();$('#bsm').textContent=trS('العملة الأساسية: '+nb);view()}
function addC(){const k=$('#c1').value.trim().toUpperCase(),r=parseFloat($('#c4').value);if(!k||D.cur[k]||!(r>0)||!$('#c3').value.trim())return err('أكمل الحقول بسعر صحيح ورمز غير مكرر');D.cur[k]={n:$('#c3').value.trim(),s:$('#c2').value.trim()||k,r};save();view()}
function delC(k){if(D.debts.some(d=>d.cur==k)||D.ex.some(e=>e.cur==k))return modal('<h3>لا يمكن الحذف</h3><p class="mut">هذه العملة مستخدمة في ديون أو مصاريف.</p>');delete D.cur[k];save();view()}

/* ---------- الإعدادات ---------- */
function sets(){const t=LS.g('dm_theme','');return `<div class="card"><b>الحساب: ${esc(U)}</b><p class="mut" style="margin:4px 0 10px">${D.debts.length} دين · ${D.ex.length} حركة</p><button class="del" onclick="logout()">تسجيل الخروج</button></div>
 <div class="card"><label style="margin:0">المظهر<select onchange="LS.s('dm_theme',this.value);theme(this.value)"><option value="" ${!t?'selected':''}>تلقائي</option><option value="light" ${t=='light'?'selected':''}>فاتح</option><option value="dark" ${t=='dark'?'selected':''}>داكن</option></select></label></div>
 <div class="card"><b>نسخة احتياطية</b><p class="mut" style="margin:4px 0">انسخ النص واحفظه في مكان آمن، ولصقه لاحقاً للاستعادة على أي جهاز.</p><textarea id="bk" onfocus="this.select()">${esc(JSON.stringify(D))}</textarea><div class="acts"><button onclick="cp()">نسخ</button><button onclick="imp()">استعادة من النص</button></div><div class="err" id="er"></div></div>
 <div class="card"><button class="del" onclick="ask('مسح كل بياناتك؟ لا يمكن التراجع',()=>{D=def();save();view()})">مسح كل البيانات</button></div>`}
function cp(){const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}err('تم تحديد النص، انسخه إن لم ينسخ تلقائياً')}
function imp(){try{const o=JSON.parse($('#bk').value);if(!o.cur||!o.base||!Array.isArray(o.debts)||!Array.isArray(o.ex)||!o.cur[o.base])throw 0;D=o;save();shell();tab='sets';view()}catch(e){err('النص غير صالح')}}


const CH=[['all','الكل'],['in','لي'],['out','عليّ'],['done','مسددة'],['ppl','الأشخاص']],PAL=['#14b8a6','#f59e0b','#6366f1','#ef4444','#10b981','#3b82f6','#ec4899','#8b5cf6','#64748b'];
const tot=()=>{let i=0,o=0;D.debts.forEach(d=>{const x=conv(rem(d),d.cur);d.dir=='in'?i+=x:o+=x});return[i,o]};
function mon(){const m=new Date().toISOString().slice(0,7);let eo=0;const c={};D.ex.filter(e=>e.date.startsWith(m)&&e.type!='inc').forEach(e=>{const x=conv(e.amt,e.cur);eo+=x;c[e.cat]=(c[e.cat]||0)+x});return{eo,c}}
function alerts(){const lim=new Date(Date.now()+3*864e5).toISOString().slice(0,10);const L=D.debts.filter(d=>rem(d)>0&&d.due&&d.due<=lim).sort((a,b)=>a.due>b.due?1:-1);if(!L.length)return'';return `<div class="card al"><b>⏰ ${L.length} استحقاق قريب أو متأخر</b>${L.slice(0,3).map(d=>`<div class="row" style="margin-top:6px"><span>${esc(d.person)} · ${d.due}</span><b>${fmt(rem(d),d.cur)}</b></div>`).join('')}</div>`}
function hero(){const[i,o]=tot();return `<div class="card hero"><small>صافي وضعك في الديون</small><div class="big">${fmt(i-o,D.base)}</div><div class="acts"><button onclick="debtM()">＋ دين</button><button onclick="expM()">＋ مصروف</button></div></div>`}
function dcard(){const{eo,c}=mon(),cl=Object.entries(c).sort((a,b)=>b[1]-a[1]);let a=0;const g=cl.map(([k,v],i)=>{const s=a;a+=v/eo*100;return `${PAL[i%9]} ${s}% ${a}%`}).join(','),bd=D.bud||{},bl=Object.keys(bd).filter(k=>bd[k]>0);

const addDays=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
const addMonths=(s,n)=>{const[y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)};
function buildSched(total,n,start){const base=Math.floor(total*100/n)/100,out=[];for(let i=0;i<n;i++)out.push({due:addMonths(start,i),amt:i<n-1?base:+(total-base*(n-1)).toFixed(2)});return out}
function syncDue(d){if(!d.sched)return;const p=paid(d);let c=0;const nx=d.sched.find(x=>{c+=x.amt;return p<c-1e-9});d.due=nx?nx.due:''}

ar:[["مرحباً بك في GT-DAYN","برنامج يساعدك تدير ديونك ومصاريفك ومبيعاتك بعدة عملات. كل بياناتك تبقى على جهازك."],["الديون والأقساط","سجّل اللي لك واللي عليك، وأضف دفعات جزئية، أو قسّط المبلغ على شهور، والتذكيرات تنبهك قبل الاستحقاق."],["المصاريف والمبيعات","سجّل مصاريفك ودخلك، وسجّل بيعاتك وشوف الربح مباشرة. البيع بالدين ينحفظ تلقائياً كدين."],["الفواتير والتقارير","فاتورة PDF لكل شخص جاهزة للطباعة، ومقاصة بين الديون، وقسمة المصاريف المشتركة بين الأصدقاء."],["أدوات يومية","حاسبة الزكاة، ومحوّل عملات، والتاريخ الهجري، وأكثر من 15 عملة بينها عملات الخليج."],["أمانك أولاً","رمز PIN وقفل تلقائي ونسخ احتياطية. ما في سيرفر يحفظ بياناتك."]],
en:[["Welcome to GT-DAYN","An app to manage your debts, expenses and sales in multiple currencies. All your data stays on your device."],["Debts & installments","Track what you owe and what you are owed, record partial payments, split amounts into monthly installments, and get due-date reminders."],["Expenses & sales","Log expenses and income, record sales and see the profit instantly. Sales on credit are added to debts automatically."],["Invoices & reports","Printable PDF invoices per person, debt netting between people, and splitting shared bills among friends."],["Everyday tools","Zakat calculator, currency converter, Hijri date display, and over 15 currencies including Gulf currencies."],["Your safety first","PIN lock, auto-lock and backups. No server stores your data."]],
tr:[["GT-DAYN'e hoş geldiniz","Borçlarınızı, giderlerinizi ve satışlarınızı birden fazla para biriminde yönetmenize yardımcı olan bir uygulama. Tüm verileriniz cihazınızda kalır."],["Borçlar ve taksitler","Borçlarınızı ve alacaklarınızı takip edin, kısmi ödemeler kaydedin, tutarları aylık taksitlere bölün ve vade hatırlatıcıları alın."],["Giderler ve satışlar","Gider ve gelirlerinizi kaydedin, satışlarınızı girin ve kârı anında görün. Veresiye satışlar otomatik olarak borca eklenir."],["Faturalar ve raporlar","Kişiye özel yazdırılabilir PDF faturalar, kişiler arası borç mahsuplaştırma ve arkadaşlar arasında ortak giderlerin paylaştırılması."],["Günlük araçlar","Zekat hesaplayıcı, para birimi çevirici, Hicri tarih gösterimi ve Körfez para birimleri dahil 15'ten fazla para birimi."],["Önce güvenliğiniz","PIN kilidi, otomatik kilit ve yedeklemeler. Verilerinizi hiçbir sunucu saklamaz."]]
};
let WI=0;
function welcomeM(){const S=WELC[LANG]||WELC.ar,s=S[WI],last=WI==S.length-1;modal(`<div style="text-align:center">${ICON(72)}</div><div class="dots">${S.map((_,i)=>`<i class="${i==WI?'on':''}"></i>`).join('')}</div><h3 style="text-align:center;margin-top:10px">${s[0]}</h3><p class="pt" style="text-align:center;font-size:15px">${s[1]}</p><div class="acts" style="justify-content:space-between;margin-top:16px"><button ${WI==0?'disabled':''} onclick="WI--;welcomeM()">${LX('السابق','Back','Geri')}</button><button class="pri" style="margin:0;width:auto;padding:10px 20px" onclick="${last?'welcomeDone()':'WI++;welcomeM()'}">${last?LX('ابدأ','Get started','Başla'):LX('التالي','Next','İleri')}</button></div><button class="link" style="width:100%;margin-top:10px" onclick="welcomeDone()">${LX('تخطي','Skip','Atla')}</button>`)}
function welcomeDone(){LS.s('dm_welcome','1');WI=0;closeM()}

function zakatM(){modal(`<h3>🕌 ${LX('حاسبة الزكاة','Zakat calculator','Zekat hesaplayıcı')}</h3><p class="mut">${LX('تقريبية. استشر عالماً أو مختصاً لحالتك.','Approximate. Consult a scholar for your case.','Yaklaşık sonuçtur. Durumunuz için bir uzmana danışın.')}</p><label>${LX('النقد والمدخرات','Cash & savings','Nakit ve birikimler')}<input id="z1" type="number" inputmode="decimal" step="any" oninput="zakatCalc()"></label><label>${LX('قيمة الذهب والفضة','Gold & silver value','Altın ve gümüş değeri')}<input id="z2" type="number" inputmode="decimal" step="any" oninput="zakatCalc()"></label><label>${LX('ديون لك عند الناس','Money owed to you','Alacaklarınız')}<input id="z3" type="number" inputmode="decimal" step="any" oninput="zakatCalc()"></label><label>${LX('ديون عليك (تُخصم)','Your debts (deducted)','Borçlarınız (düşülür)')}<input id="z4" type="number" inputmode="decimal" step="any" oninput="zakatCalc()"></label><label>${LX('قيمة النصاب بعملتك','Nisab value in your currency','Nisap değeri (para biriminizde)')}<input id="z5" type="number" inputmode="decimal" step="any" oninput="zakatCalc()"></label><div class="calc" id="zr"></div>`);zakatCalc()}
function zakatCalc(){const v=id=>+($('#'+id).value)||0,base=v('z1')+v('z2')+v('z3')-v('z4'),nis=v('z5'),due=nis>0&&base>=nis?base*0.025:0;$('#zr').innerHTML=`<div class="row"><span>${LX('الوعاء الزكوي','Zakat base','Zekat matrahı')}</span><b>${fmt(Math.max(0,base),D.base)}</b></div><div class="row" style="font-size:18px;margin-top:6px"><span>${LX('الزكاة المستحقة 2.5%','Zakat due (2.5%)','Ödenecek zekat (%2,5)')}</span><b>${fmt(due,D.base)}</b></div><small>${nis<=0?LX('أدخل قيمة النصاب','Enter the nisab value','Nisap değerini girin'):base>=nis?LX('بلغ النصاب، فيه زكاة','Above nisab, zakat applies','Nisap aşıldı, zekat gerekir'):LX('ما بلغ النصاب، ما فيه زكاة','Below nisab, no zakat due','Nisabın altında, zekat gerekmez')}</small>`}

function convM(){const first=Object.keys(D.cur)[0],opt=x=>Object.keys(D.cur).map(c=>`<option value="${c}" ${c==x?'selected':''}>${c} · ${esc(D.cur[c].n)}</option>`).join('');modal(`<h3>🔄 ${LX('محوّل العملات','Currency converter','Para birimi çevirici')}</h3><label>${LX('المبلغ','Amount','Tutar')}<input id="cv1" type="number" inputmode="decimal" step="any" value="1" oninput="convCalc()"></label><div class="two"><label>${LX('من','From','Kimden')}<select id="cv2" onchange="convCalc()">${opt(D.cur.USD?'USD':first)}</select></label><label>${LX('إلى','To','Kime')}<select id="cv3" onchange="convCalc()">${opt(D.cur.SAR?'SAR':D.base)}</select></label></div><div class="calc" id="cvr"></div><small class="mut">${LX('حسب الأسعار المحفوظة في تبويب العملات.','Uses the rates saved in the Currencies tab.','Para birimleri sekmesindeki kayıtlı kurlar kullanılır.')}</small>`);convCalc()}
function convCalc(){const a=+$('#cv1').value||0,f=$('#cv2').value,t=$('#cv3').value,r=a*D.cur[f].r/D.cur[t].r;$('#cvr').innerHTML=`<div class="row" style="font-size:18px"><span>${fmt(a,f)}</span><b>= ${fmt(r,t)}</b></div>`}

function splitM(){modal(`<h3>✂️ ${LX('قسمة مصروف','Split an expense','Gideri paylaştır')}</h3><p class="mut">${LX('اكتب المبلغ الكلي وأسماء الأشخاص، ينقسم بالتساوي، ويتسجّل دين على كل واحد.','Enter the total and names. It is split equally and each person gets a debt.','Toplamı ve isimleri girin. Eşit paylaştırılır ve her kişi için borç kaydedilir.')}</p><label>${LX('الوصف','Description','Açıklama')}<input id="sp1" placeholder="${LX('عشاء','Dinner','Akşam yemeği')}"></label><div class="two"><label>${LX('المبلغ الكلي','Total','Toplam')}<input id="sp2" type="number" inputmode="decimal" step="any" oninput="splitCalc()"></label><label>${LX('العملة','Currency','Para birimi')}<select id="sp3" onchange="splitCalc()">${co(D.base)}</select></label></div><label>${LX('الأشخاص (افصل بفاصلة)','People (comma separated)','Kişiler (virgülle ayırın)')}<input id="sp4" oninput="splitCalc()" placeholder="${LX('أحمد، سارة','Ahmed, Sara','Ali, Ayşe')}"></label><div class="calc" id="spr"></div><div class="err" id="er"></div><button class="pri" onclick="splitSave()">${LX('حفظ القسمة','Save split','Paylaşımı kaydet')}</button>`);splitCalc()}
const splitNames=()=>($('#sp4').value||'').split(/[,،]/).map(x=>x.trim()).filter(Boolean);
function splitCalc(){const t=+$('#sp2').value||0,n=splitNames().length,sh=n?t/(n+1):0;$('#spr').innerHTML=`<div class="row"><span>${LX('حصة كل شخص','Each person owes','Her kişinin payı')}</span><b>${fmt(sh,$('#sp3').value)}</b></div><small>${LX('تدفع وتحسب حصتك كمان، يعني القسمة على عدد الأشخاص + 1.','You pay and keep your share too, so divide by people + 1.','Siz de dahil olduğunuz için kişi sayısı + 1 ile bölünür.')}</small>`}
function splitSave(){const t=+$('#sp2').value,names=splitNames(),cu=$('#sp3').value,desc=($('#sp1').value||'').trim();if(!(t>0))return err(LX('اكتب مبلغاً صحيحاً','Enter a valid amount','Geçerli bir tutar girin'));if(!names.length)return err(LX('اكتب اسم شخص واحد على الأقل','Enter at least one name','En az bir isim girin'));const sh=+(t/(names.length+1)).toFixed(2),date=today();names.forEach(n=>D.debts.push({id:uid(),dir:'in',person:n,amt:sh,cur:cu,date,due:'',note:desc||LX('قسمة','Split','Paylaşım'),pays:[]}));save();closeM();view()}

const s=LS.g('dm_sess','');
if(s){const sd=LS.g('dm_d_'+s,null);if(sd&&sd.pinH){U=s;D=sd;LOCK.on=true;lockUI()}else enter(s)}else authUI();
</script></body></html>
